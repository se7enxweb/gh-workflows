name: Upmerge branch (callee)

# Exponential Platform (se7enxweb): after a push to a maintenance branch,
# merge it up into the next branch (for example 4.6 -> main).
#
# Which branch goes where, first match wins:
#   1. .github/upmerge-map.json of the pushed repository (at the pushed commit)
#   2. <map-repository>/<owner>/<repo> (a JSON file), default se7enxweb/upmerge-map
# Format: {"<source branch>": "<destination branch>", ...}
#
# Without a map, or for a branch the map does not name, nothing is merged and
# the run succeeds. The merge is pushed with robot-token when it is set (so the
# push starts the destination's own workflows), otherwise with the workflow
# token. A merge conflict fails the run: it has to be resolved by hand.

on:
  workflow_call:
    inputs:
      map-repository:
        required: false
        type: string
        default: 'se7enxweb/upmerge-map'
    secrets:
      robot-token:
        description: 'Optional token used to push the merge'
        required: false
      AUTOMATION_CLIENT_ID:
        description: 'Unused, accepted for compatibility with older callers'
        required: false
      AUTOMATION_CLIENT_SECRET:
        description: 'Unused, accepted for compatibility with older callers'
        required: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Get merge map
        id: map
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_REPOSITORY: ${{ inputs.map-repository }}
        run: |
          if map=$(gh api -H 'Accept: application/vnd.github.raw' "/repos/${GITHUB_REPOSITORY}/contents/.github/upmerge-map.json?ref=${GITHUB_SHA}" 2>/dev/null); then
            echo "Using .github/upmerge-map.json"
          elif map=$(gh api -H 'Accept: application/vnd.github.raw' "/repos/${MAP_REPOSITORY}/contents/${GITHUB_REPOSITORY}" 2>/dev/null); then
            echo "Using ${MAP_REPOSITORY}/${GITHUB_REPOSITORY}"
          else
            echo "::notice::No upmerge map for ${GITHUB_REPOSITORY}; nothing to merge."
            exit 0
          fi
          destination=$(printf '%s' "$map" | jq -r --arg b "$GITHUB_REF_NAME" '.[$b] // empty')
          if [ -z "$destination" ]; then
            echo "::notice::No upmerge destination for branch ${GITHUB_REF_NAME}; nothing to merge."
            exit 0
          fi
          echo "destination=${destination}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.map.outputs.destination != ''
        with:
          ref: ${{ steps.map.outputs.destination }}
          fetch-depth: 0
          token: ${{ secrets.robot-token || github.token }}

      - name: Merge ${{ github.ref_name }} into ${{ steps.map.outputs.destination }}
        if: steps.map.outputs.destination != ''
        env:
          DEST_BRANCH: ${{ steps.map.outputs.destination }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -m "Merged branch '${GITHUB_REF_NAME}' into ${DEST_BRANCH}" "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${DEST_BRANCH}"
