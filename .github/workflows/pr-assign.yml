# Very Important Note:
# Never, ever, under any circumstances run any commands that take inputs
# from the PR for scripting purposes.
# This is unsafe with pull_request_target trigger.
# See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

name: Assign Pull Request to maintainers

# Exponential Platform (se7enxweb): assign a new pull request to the
# maintainers of the files it changes.
#
# The maintainers list, first match wins:
#   1. .github/maintainers.json of the base branch (never the PR's own copy)
#   2. <map-repository>/<owner>/<repo>/maintainers, default se7enxweb/pr-assignees
#   3. none: the repository owner is assigned when it is a user account
# An "extension" of "*" matches every pull request, even one without files.
# Format: {"params": [{"extension": "<regex on file names>", "assignee": "login1,login2"}, ...]}

on:
  workflow_call:
    inputs:
      map-repository:
        description: 'Repository holding the maintainers lists'
        required: false
        type: string
        default: 'se7enxweb/pr-assignees'
    secrets:
      robot-token:
        description: 'Unused, accepted for compatibility with older callers'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest

    steps:
      # NOTE: No checkout step: this workflow only uses the GitHub API to
      # inspect PR metadata. Checking out untrusted PR code under
      # pull_request_target would be a "pwn request" vulnerability.
      - name: Assign maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          MAP_REPOSITORY: ${{ inputs.map-repository }}
        run: |
          if [ -z "$PR" ]; then
            echo "::notice::Not a pull request event; nothing to assign."
            exit 0
          fi
          if map=$(gh api -H 'Accept: application/vnd.github.raw' "/repos/${REPO}/contents/.github/maintainers.json?ref=${BASE_SHA}" 2>/dev/null); then
            echo "Maintainers from .github/maintainers.json"
          elif map=$(gh api -H 'Accept: application/vnd.github.raw' "/repos/${MAP_REPOSITORY}/contents/${REPO}/maintainers" 2>/dev/null); then
            echo "Maintainers from ${MAP_REPOSITORY}"
          elif [ "$OWNER_TYPE" = "User" ]; then
            echo "No maintainers list; assigning the repository owner ${OWNER}"
            map=$(jq -nc --arg o "$OWNER" '{params: [{extension: "*", assignee: $o}]}')
          else
            echo "::notice::No maintainers list for ${REPO}; nothing to assign."
            exit 0
          fi
          files=$(gh api --paginate "/repos/${REPO}/pulls/${PR}/files" --jq '.[].filename | split("/") | .[-1]')
          assignees=""
          while IFS=$'\t' read -r extension assignee; do
            [ -z "$extension" ] && continue
            if [ "$extension" = "*" ] || printf '%s\n' "$files" | grep -qP -- "$extension"; then
              assignees="${assignees:+$assignees,}${assignee}"
            fi
          done < <(printf '%s' "$map" | jq -r '.params[] | [.extension, .assignee] | @tsv')
          if [ -z "$assignees" ]; then
            echo "No maintainer matches the changed files."
            exit 0
          fi
          echo "Assigning: ${assignees}"
          jq -nc --arg a "$assignees" '{assignees: ($a | split(",") | unique)}' |
            gh api -X POST "/repos/${REPO}/issues/${PR}/assignees" --input - >/dev/null
