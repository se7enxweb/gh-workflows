name: Expand Team Reviewers

on:
  workflow_call:
    inputs:
      requested_team:
        description: 'Slug of the requested team'
        required: true
        type: string
      pull_request_number:
        description: 'Pull request number'
        required: true
        type: number
      repository:
        description: 'Repository in org/repo format'
        required: true
        type: string
    secrets:
      AUTOMATION_CLIENT_ID:
        description: 'Optional GitHub App that can read the organisation teams'
        required: false
      AUTOMATION_CLIENT_SECRET:
        required: false
      robot-token:
        description: 'Optional token with read:org that can read the organisation teams'
        required: false

# Exponential Platform (se7enxweb): teams only exist in organisations. For a
# repository owned by a user account (se7enxweb is one) there is nothing to
# expand and the run ends successfully. In an organisation, the team is read
# with the GitHub App when AUTOMATION_CLIENT_ID is set, otherwise with
# robot-token, otherwise with the workflow token (which can read the members
# of a visible team only).

permissions:
  contents: read
  pull-requests: write

jobs:
  expand-team-reviewers:
    runs-on: ubuntu-latest

    steps:
      - name: Check the repository owner
        id: owner
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          HAS_APP: ${{ secrets.AUTOMATION_CLIENT_ID != '' }}
        run: |
          if [ "$OWNER_TYPE" != "Organization" ]; then
            echo "::notice::${GITHUB_REPOSITORY_OWNER} is not an organisation, so it has no teams to expand."
            echo "org=false" >> "$GITHUB_OUTPUT"
          else
            echo "org=true" >> "$GITHUB_OUTPUT"
          fi
          echo "app=${HAS_APP}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        if: steps.owner.outputs.org == 'true' && steps.owner.outputs.app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate_token
        with:
          client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Expand team to individual reviewers
        if: steps.owner.outputs.org == 'true'
        shell: bash
        env:
          org: ${{ github.repository_owner }}
          repo: ${{ inputs.repository }}
          team: ${{ inputs.requested_team }}
          pr: ${{ inputs.pull_request_number }}
          pr_author: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token || secrets.robot-token || github.token }}
        run: |
          # Get team members, but filter out a PR author because review cannot be requested from the author
          members=$(gh api /orgs/$org/teams/$team/members \
                        --paginate \
                        --jq '.[].login | select(. != "'"$pr_author"'")' )

          exit_code=$?
          if [[ $exit_code -ne 0 ]]
          then
            echo "Error: Failed to fetch team members"
            echo "$members" # contains the error message
            exit $exit_code
          fi

          # Members who already gave a verdict must not be re-requested, otherwise their review
          # disappears from the reviewers sidebar
          reviewed=$(gh api /repos/$repo/pulls/$pr/reviews \
                        --paginate \
                        --jq '.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED") | .user.login')

          exit_code=$?
          if [[ $exit_code -ne 0 ]]
          then
            echo "Error: Failed to fetch pull request reviews"
            echo "$reviewed" # contains the error message
            exit $exit_code
          fi

          skipped=$(comm -12 <(sort <<< "$members") <(sort <<< "$reviewed") | paste -sd ",")
          if [[ -n "$skipped" ]]
          then
            echo "Skipping $org/$team members who already reviewed $repo#$pr: $skipped"
          fi
          members=$(comm -23 <(sort <<< "$members") <(sort <<< "$reviewed"))

          if [[ -n "$members" ]]
          then
            members_list=$(echo "$members" | paste -sd ",")
            echo "Requesting review for $repo#$pr from $org/$team members: $members_list"

            gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/$repo/pulls/$pr/requested_reviewers --input - <<< '{
                    "reviewers": [],
                    "team_reviewers": [
                        "'"$team"'"
                    ]
            }'

            # Use the additive REST endpoint rather than "gh pr edit --add-reviewer", which replaces
            # the whole reviewer set and drops reviewers added concurrently by another team expansion
            jq -n --arg members "$members" '{"reviewers": ($members | split("\n"))}' | gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/$repo/pulls/$pr/requested_reviewers --input -
          fi
