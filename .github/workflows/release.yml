name: Create Release for tag (project)

# Exponential Platform (se7enxweb) release for a project or metapackage tag
# (oss, exponential-platform-dxp, the skeletons). Same rules as
# release_bundle.yml: a release is created only when none exists, never
# edited; the notes also list the package versions that changed in
# composer.lock since the previous tag.
#
# The Ibexa version needed the ibexa GitHub App, a JIRA token and the
# repository wiki; none of that is used here.

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ''
      wait-minutes:
        required: false
        type: number
        default: 10
      dry-run:
        required: false
        type: boolean
        default: false
    secrets:
      AUTOMATION_CLIENT_ID:
        required: false
      AUTOMATION_CLIENT_INSTALLATION:
        required: false
      AUTOMATION_CLIENT_SECRET:
        required: false
      JIRA_TOKEN:
        required: false
      EZROBOT_33:
        required: false

permissions:
  contents: write

jobs:
  create_release:
    uses: se7enxweb/gh-workflows/.github/workflows/release_bundle.yml@main
    with:
      tag: ${{ inputs.tag }}
      wait-minutes: ${{ inputs.wait-minutes }}
      dry-run: ${{ inputs.dry-run }}
