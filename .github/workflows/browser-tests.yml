name: Browser tests (Exponential Platform)

# Exponential Platform (se7enxweb) browser tests.
#
# Builds a real Exponential Platform DXP project with the package under test
# in it, installs it on SQLite with the clean demo data, builds the admin
# assets, serves it with PHP's built-in server and drives it with Chromium
# (Playwright): the front page must render, and the admin must accept the
# administrator login.
#
#   - A package (core, admin-ui, fieldtype-richtext ...) is tested inside a
#     project created from the skeleton (input `skeleton`, default
#     se7enxweb/exponential-platform-dxp-skeleton); the checked out package
#     replaces the released one through a Composer path repository.
#   - A project or metapackage repository (a skeleton, exponential-platform-dxp,
#     oss ...) is the thing installed: a skeleton is created from the checkout
#     itself, a metapackage is swapped into the skeleton like a package.
#
# Everything comes from public sources (Packagist, GitHub); no secrets are
# required. SLACK_WEBHOOK_URL, when set, receives the result of non-PR runs.
#
# The inputs of the Ibexa workflow (project-edition, test-suite, setup,
# test-setup-phase-*, php-image, multirepository, job-count ...) are accepted
# so that older callers keep working; they are recorded in the run summary.
# The Ibexa Behat suites need the Ibexa CI images and services and are not
# run here.

on:
    workflow_call:
        inputs:
            skeleton:
                description: "Composer package of the project skeleton"
                required: false
                type: string
                default: ""
            skeleton-version:
                description: "Version of the skeleton to create the project from"
                required: false
                type: string
                default: ""
            remove-packages:
                description: "Space separated packages to remove from the project before adding the tested one"
                required: false
                type: string
                default: ""
            php-version:
                description: "PHP version"
                required: false
                type: string
                default: "8.4"
            node-version:
                required: false
                type: string
                default: "22"
            node-resolutions:
                description: "JSON of yarn resolutions applied when the project has no yarn.lock"
                required: false
                type: string
                default: '{"webpack": "5.106.2"}'
            install-type:
                description: "Installer type given to exponential:install"
                required: false
                type: string
                default: "exponential-oss"
            admin-paths:
                description: "Comma separated admin URLs tried for the login form"
                required: false
                type: string
                default: "/adminui/login,/admin/login,/login"
            admin-user:
                required: false
                type: string
                default: "admin"
            admin-password:
                required: false
                type: string
                default: "publish"
            build-assets:
                description: "Build the frontend and admin assets with yarn"
                required: false
                type: boolean
                default: true
            timeout:
                default: 60
                description: "Job maximum timeout in minutes"
                required: false
                type: number
            # Accepted for compatibility with the Ibexa workflow
            project-edition:
                required: false
                type: string
                default: "oss"
            test-suite:
                required: false
                type: string
                default: ""
            project-version:
                required: false
                type: string
                default: ""
            setup:
                required: false
                type: string
                default: ""
            test-setup-phase-1:
                required: false
                type: string
                default: ""
            test-setup-phase-2:
                required: false
                type: string
                default: ""
            multirepository:
                required: false
                type: boolean
                default: false
            php-image:
                required: false
                type: string
                default: ""
            ci-scripts-branch:
                required: false
                type: string
                default: ""
            use-compatibility-layer:
                required: false
                type: boolean
                default: false
            job-count:
                required: false
                type: number
                default: 1
            send-success-notification:
                required: false
                type: boolean
                default: true
            install-connector-quable:
                required: false
                type: boolean
                default: false
        secrets:
            SLACK_WEBHOOK_URL:
                required: false
            SATIS_NETWORK_KEY:
                required: false
            SATIS_NETWORK_TOKEN:
                required: false
            AUTOMATION_CLIENT_ID:
                required: false
            AUTOMATION_CLIENT_SECRET:
                required: false
            AUTOMATION_CLIENT_INSTALLATION:
                required: false
            EZROBOT_33:
                required: false
            PERCY_TOKEN:
                required: false
            CLOUDINARY_URL:
                required: false
            LAMBDATEST_PROJECT_TOKEN:
                required: false
            LAMBDATEST_USERNAME:
                required: false
            LAMBDATEST_ACCESS_KEY:
                required: false

permissions:
    contents: read

env:
    APP_ENV: prod
    APP_DEBUG: 0
    COMPOSER_NO_INTERACTION: 1
    COMPOSER_MEMORY_LIMIT: -1

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            skip: ${{ steps.plan.outputs.skip }}
            name: ${{ steps.plan.outputs.name }}
            kind: ${{ steps.plan.outputs.kind }}
            source: ${{ steps.plan.outputs.source }}
            version: ${{ steps.plan.outputs.version }}
            skeleton: ${{ steps.plan.outputs.skeleton }}
            skeleton-version: ${{ steps.plan.outputs.skeleton-version }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  path: package
                  sparse-checkout: composer.json
                  sparse-checkout-cone-mode: false

            - name: Record the requested setup
              env:
                  EDITION: ${{ inputs.project-edition }}
                  SUITE: ${{ inputs.test-suite }}
                  SETUP: ${{ inputs.setup }}
              run: |
                  {
                    echo "### Browser tests"
                    echo
                    echo "- Edition requested by the caller: \`${EDITION}\`"
                    if [ -n "$SUITE" ]; then echo "- Ibexa Behat suite named by the caller (not run here): \`${SUITE}\`"; fi
                    if [ -n "$SETUP" ]; then echo "- Ibexa docker setup named by the caller (not used here): \`${SETUP}\`"; fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Work out what to install
              id: plan
              env:
                  SKELETON: ${{ inputs.skeleton }}
                  SKELETON_VERSION: ${{ inputs.skeleton-version }}
                  PROJECT_VERSION: ${{ inputs.project-version }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  name=$(jq -r '.name' package/composer.json)
                  # Packagist knows the repository under the name on its default branch;
                  # a maintenance branch may still carry an older name (core 4.6: ibexa/core).
                  canonical=$(gh api -H 'Accept: application/vnd.github.raw' "/repos/${GITHUB_REPOSITORY}/contents/composer.json" 2>/dev/null | jq -r '.name // empty' 2>/dev/null || true)
                  if [ -n "$canonical" ] && [ "$canonical" != "$name" ]; then
                      echo "::notice::${name} is published as ${canonical}; testing it under that name."
                      name="$canonical"
                  fi
                  type=$(jq -r '.type // "library"' package/composer.json)
                  branch=$(jq -r '(.extra["branch-alias"] // {}) | keys[0] // empty' package/composer.json)
                  alias=$(jq -r '(.extra["branch-alias"] // {}) | to_entries[0].value // empty' package/composer.json)
                  [ -z "$branch" ] && branch="dev-${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
                  # kind: a Symfony project (skeleton) is installed itself, anything
                  # else is put into a project created from the skeleton.
                  if [ "$type" = "project" ] && jq -e ".extra.symfony" package/composer.json >/dev/null; then
                      kind=skeleton
                  else
                      kind=package
                  fi
                  # source: the checkout, or a released version when one was asked for.
                  if [ -n "$PROJECT_VERSION" ]; then source=release; version="$PROJECT_VERSION"; else source=checkout; version="$branch"; fi
                  if [ -z "$SKELETON" ]; then
                      line="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
                      case "$alias $line" in
                          4.*|*" 4."*) SKELETON=se7enxweb/exponential-platform-v4x-dxp-skeleton ;;
                          *)   SKELETON=se7enxweb/exponential-platform-dxp-skeleton ;;
                      esac
                  fi
                  [ -z "$SKELETON_VERSION" ] && SKELETON_VERSION="dev-master"
                  skip=false
                  if [ "$kind" = package ] && [ -z "${{ inputs.skeleton }}" ] && { case "${GITHUB_BASE_REF:-$GITHUB_REF_NAME} $alias" in 3.*|*" 3."*) true ;; *) false ;; esac; }; then
                      # There is no Exponential Platform skeleton for the 3.x line.
                      skip=true
                      echo "::notice::No Exponential Platform skeleton exists for ${name} ${alias}; browser tests skipped."
                  fi
                  [ "$kind" = skeleton ] && SKELETON="$name" && SKELETON_VERSION="$version"
                  {
                      echo "name=$name"; echo "type=$type"; echo "branch=$branch"; echo "alias=$alias"
                      echo "skip=$skip"
                      echo "kind=$kind"; echo "source=$source"; echo "version=$version"
                      echo "skeleton=$SKELETON"; echo "skeleton-version=$SKELETON_VERSION"
                  } | tee -a "$GITHUB_OUTPUT"
                  echo "- Installed: \`${SKELETON}:${SKELETON_VERSION}\` with \`${name}:${version}\` (${kind}, from the ${source}${alias:+, alias $alias})" >> "$GITHUB_STEP_SUMMARY"

    browser-tests:
        needs: plan
        if: needs.plan.outputs.skip != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: ${{ inputs.timeout }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  path: package

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  repository: se7enxweb/gh-workflows
                  ref: main
                  path: .gh-workflows
                  sparse-checkout: actions/exponential-browser-tests

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ inputs.php-version }}
                  coverage: none
                  extensions: gd, intl, xsl, pdo_sqlite, sqlite3, curl, mbstring, zip, sodium
                  ini-values: memory_limit=-1
                  tools: composer:v2

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Composer authentication
              run: composer config -g github-oauth.github.com "${{ github.token }}"

            - name: Create the project
              env:
                  NAME: ${{ needs.plan.outputs.name }}
                  KIND: ${{ needs.plan.outputs.kind }}
                  SOURCE: ${{ needs.plan.outputs.source }}
                  VERSION: ${{ needs.plan.outputs.version }}
                  SKELETON: ${{ needs.plan.outputs.skeleton }}
                  SKELETON_VERSION: ${{ needs.plan.outputs.skeleton-version }}
                  REMOVE: ${{ inputs.remove-packages }}
              run: |
                  if [ "$(jq -r .name package/composer.json)" != "$NAME" ]; then
                      jq --arg n "$NAME" '.name = $n | if .replace then .replace |= del(.[$n]) else . end' package/composer.json > package/composer.json.new
                      mv -f package/composer.json.new package/composer.json
                  fi
                  repo=$(jq -nc --arg url "$GITHUB_WORKSPACE/package" --arg n "$NAME" --arg v "$VERSION" \
                         '{type: "path", url: $url, options: {symlink: false, versions: {($n): $v}}}')
                  if [ "$KIND" = skeleton ] && [ "$SOURCE" = checkout ]; then
                      composer create-project "$SKELETON" project "$SKELETON_VERSION" --repository="$repo" --no-install --no-scripts
                  else
                      composer create-project "$SKELETON" project "$SKELETON_VERSION" --no-install --no-scripts
                  fi
                  cd project
                  composer config allow-plugins true
                  if [ "$KIND" = package ]; then
                      # Development versions of the tested package and its siblings must resolve.
                      composer config minimum-stability dev
                      composer config prefer-stable true
                      [ "$SOURCE" = checkout ] && composer config repositories.tested "$repo"
                      for p in $REMOVE; do composer remove "$p" --no-update; done
                      composer require "${NAME}:${VERSION}" --no-update
                  fi
                  cat composer.json

            - name: Configure the environment
              working-directory: project
              run: |
                  {
                      echo "APP_ENV=prod"
                      echo "APP_DEBUG=0"
                      echo "APP_SECRET=$(openssl rand -hex 32)"
                      echo 'DATABASE_URL="sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db"'
                      echo "MESSENGER_TRANSPORT_DSN=sync://"
                      echo "SEARCH_ENGINE=legacy"
                  } > .env.local

            - name: Composer install
              working-directory: project
              run: |
                  composer install --no-progress
                  if [ "${{ needs.plan.outputs.kind }}" = package ]; then composer show "${{ needs.plan.outputs.name }}"; else composer show --self | head -n 12; fi
                  [ -f .env ] && cat .env.local >> .env || cp .env.local .env

            - name: Install the database
              working-directory: project
              run: |
                  if php bin/console list exponential 2>/dev/null | grep -q 'exponential:install'; then
                      php bin/console exponential:install --no-interaction "${{ inputs.install-type }}"
                  else
                      php bin/console ibexa:install --no-interaction
                  fi

            - name: Build assets
              if: inputs.build-assets
              working-directory: project
              env:
                  NODE_RESOLUTIONS: ${{ inputs.node-resolutions }}
              run: |
                  php bin/console assets:install --symlink --relative public
                  # 4.x projects generate their encore configs (var/encore) with this command.
                  if php bin/console list ibexa 2>/dev/null | grep -q 'ibexa:encore:compile'; then
                      php bin/console ibexa:encore:compile
                  fi
                  if [ -f package.json ]; then
                      corepack enable || true
                      if [ ! -f yarn.lock ] && [ -n "$NODE_RESOLUTIONS" ]; then
                          # No lock file: pin what the input names (by default the webpack the
                          # Exponential Platform starter locks; newer webpack 5 releases moved the
                          # internals Encore 5's copyFiles loader needs).
                          echo "No yarn.lock; resolutions: ${NODE_RESOLUTIONS}"
                          jq --argjson r "$NODE_RESOLUTIONS" '.resolutions = ((.resolutions // {}) + $r)' package.json > package.json.new
                          mv -f package.json.new package.json
                      fi
                      yarn install --non-interactive --network-timeout 600000
                      if jq -e '.scripts["ibexa:build"]' package.json >/dev/null; then yarn ibexa:build; fi
                      # The site (app) build is reported but not fatal: the admin login test
                      # needs only the admin assets built above.
                      if jq -e ".scripts.build" package.json >/dev/null && ! yarn build; then
                          echo "::warning::yarn build (site assets) failed in this project; see the log above."
                      fi
                  fi

            - name: Warm up and start the web server
              working-directory: project
              run: |
                  php bin/console cache:clear
                  nohup php -S 127.0.0.1:8000 -t public "$GITHUB_WORKSPACE/.gh-workflows/actions/exponential-browser-tests/router.php" > var/php-server.log 2>&1 &
                  for i in $(seq 1 60); do
                      curl -s -o /dev/null http://127.0.0.1:8000/ && break
                      sleep 2
                  done
                  curl -s -o /dev/null -w 'Front page: HTTP %{http_code}\n' http://127.0.0.1:8000/

            - name: Install Chromium
              working-directory: .gh-workflows/actions/exponential-browser-tests
              run: |
                  npm init -y >/dev/null
                  npm install --no-audit --no-fund playwright@1.48.2
                  npx playwright install --with-deps chromium

            - name: Run browser tests
              working-directory: .gh-workflows/actions/exponential-browser-tests
              run: |
                  node smoke.mjs http://127.0.0.1:8000 "${{ inputs.admin-paths }}" "${{ inputs.admin-user }}" "${{ inputs.admin-password }}" "$GITHUB_WORKSPACE/screenshots"

            - name: Logs on failure
              if: failure()
              run: |
                  if [ -d project ]; then
                      tail -n 100 project/var/php-server.log 2>/dev/null || true
                      tail -n 200 project/var/log/*.log 2>/dev/null || true
                  fi

            - name: Upload screenshots and logs
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: browser-tests-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      screenshots
                      project/var/log
                      project/var/php-server.log
                  if-no-files-found: ignore

            - name: Notify Slack
              if: always() && github.event_name != 'pull_request' && (job.status != 'success' || inputs.send-success-notification)
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  STATUS: ${{ job.status }}
              run: |
                  if [ -z "$SLACK_WEBHOOK_URL" ]; then
                      echo "SLACK_WEBHOOK_URL is not set; no notification sent."
                      exit 0
                  fi
                  text="${STATUS}: *${GITHUB_REPOSITORY}*:*${GITHUB_REF_NAME}* (${GITHUB_ACTOR}) | <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Details>"
                  jq -nc --arg t "$text" '{text: $t}' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" || true
